{% load console_tags %}{% if page.paginator.num_pages > 1 %}
<div class="pagination">
  <span class="muted small" style="margin-right:auto">Page {{ page.number }} of {{ page.paginator.num_pages }} · {{ page.paginator.count }} records</span>
  {% if page.has_previous %}<a class="btn ghost sm" href="{% qs page=page.previous_page_number %}">← Previous</a>{% endif %}
  {% if page.has_next %}<a class="btn ghost sm" href="{% qs page=page.next_page_number %}">Next →</a>{% endif %}
</div>{% endif %}
